[project]
name = "catalogue"
version = "0.1.0"
description = "Category-driven construction product catalogue"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "fastembed>=0.5",
    "langchain-core>=0.3",
    "langchain-huggingface>=1.0",
    "langchain-groq>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
